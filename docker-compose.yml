services:
  douyin-auto-reply:
    build: .
    container_name: douyin-auto-reply
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./runtime:/app/runtime
      - ./images:/app/images
      - ./.env:/app/.env:ro
    shm_size: "1gb"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
